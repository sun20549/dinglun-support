<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>照會大師 · 變更密碼</title>
<style>
  :root{
    --navy:#0d2640; --blue:#1a5fb4; --teal:#2ec4b6; --bg:#eef2f7; --card:#fff;
    --ink:#1e293b; --mut:#64748b; --line:#e2e8f0; --green:#16a34a; --amber:#d97706; --red:#dc2626;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;min-height:100vh}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  button{font:inherit;border:none;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;transition:.15s}
  button:disabled{opacity:.55;cursor:default}
  .btn-p{background:var(--blue);color:#fff}
  .btn-p:hover:not(:disabled){background:#15509a}

  #wrap{max-width:400px;margin:0 auto;padding:7vh 16px 40px}
  #pwcard{padding:32px 26px;text-align:center}
  #pwcard .icon{font-size:42px}
  #pwcard h2{margin:8px 0 4px;font-size:20px}
  #pwcard p.sub{color:var(--mut);font-size:13px;margin-bottom:20px}

  form{margin-top:4px}
  .field{text-align:left;margin-bottom:13px;position:relative}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--mut);margin-bottom:4px}
  .field input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:8px;font:inherit}
  .field input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(26,95,180,.12)}
  .field.haseye input{padding-right:44px}
  .eye{position:absolute;right:5px;top:26px;background:none;border:none;font-size:16px;padding:7px 9px;cursor:pointer;color:var(--mut);border-radius:6px}
  .eye:hover{color:var(--ink);background:#f1f5f9}

  #pwcard button.btn-p{width:100%;padding:12px;margin-top:6px;font-size:15px}
  .err{color:var(--red);font-size:13px;min-height:18px;margin-top:10px;text-align:left}

  .foot{margin-top:20px;padding-top:16px;border-top:1px solid var(--line);font-size:12px;color:var(--mut);line-height:1.7;text-align:left}
  .foot a{color:var(--blue);text-decoration:none;font-weight:600}
  .foot a:hover{text-decoration:underline}

  .succ .tick{font-size:46px}
  .succ h2{margin:10px 0 6px;font-size:19px;color:var(--green)}
  .succ p{color:var(--ink);font-size:14px;margin-bottom:14px}
  .succ .note{background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:11px 13px;font-size:12px;color:var(--mut);text-align:left;line-height:1.6}

  .backhome{display:block;margin-top:16px;text-align:center;color:var(--blue);font-size:13px;text-decoration:none}
  .backhome:hover{text-decoration:underline}
</style>
</head>
<body>
<div id="wrap">
  <div id="pwcard" class="card">

    <div id="formView">
      <div class="icon">🔑</div>
      <h2>照會大師 · 變更密碼</h2>
      <p class="sub">請輸入帳號與目前密碼，設定新密碼</p>

      <form id="pwForm">
        <div class="field">
          <label for="acc">帳號</label>
          <input id="acc" type="text" placeholder="例：unit1（會自動補 @dinglun.app）" autocomplete="username">
        </div>
        <div class="field haseye">
          <label for="curPw">目前密碼</label>
          <input id="curPw" type="password" placeholder="目前使用的密碼" autocomplete="current-password">
          <button type="button" class="eye" data-target="curPw" title="顯示/隱藏密碼">👁</button>
        </div>
        <div class="field haseye">
          <label for="newPw">新密碼</label>
          <input id="newPw" type="password" placeholder="至少 6 碼" autocomplete="new-password">
          <button type="button" class="eye" data-target="newPw" title="顯示/隱藏密碼">👁</button>
        </div>
        <div class="field haseye">
          <label for="newPw2">確認新密碼</label>
          <input id="newPw2" type="password" placeholder="再輸入一次新密碼" autocomplete="new-password">
          <button type="button" class="eye" data-target="newPw2" title="顯示/隱藏密碼">👁</button>
        </div>
        <button type="submit" class="btn-p" id="submitBtn">變更密碼</button>
        <div class="err" id="pwErr"></div>
      </form>

      <div class="foot">
        忘記目前密碼？無法自助重設，請聯絡李顧問幫你重設。<br>
        💬 <a href="https://line.me/ti/p/~leemingstar" target="_blank" rel="noopener">LINE 聯絡李顧問</a>（ID：leemingstar）
      </div>
    </div>

    <div id="succView" class="succ" style="display:none">
      <div class="tick">✅</div>
      <h2>密碼變更成功</h2>
      <p>請回到照會大師工具，用新密碼重新登入</p>
      <div class="note">
        ⚠️ 所有使用此帳號的裝置，下次登入都需輸入新密碼；已綁定的裝置不受影響，不需重新綁定。
      </div>
    </div>

    <a class="backhome" href="index.html">← 回首頁</a>
  </div>
</div>

<script>
const SUPABASE_URL = "https://zckcftmeiwaitnyogjuk.supabase.co";
const SUPABASE_KEY = "sb_publishable_O1uR23Tqqr6K93peKhqvvw_xPu7ZbAv";

async function api(path, opt){
  opt = opt || {};
  const h = Object.assign({"apikey":SUPABASE_KEY,"Content-Type":"application/json"}, opt.headers||{});
  const r = await fetch(SUPABASE_URL+path, Object.assign({headers:h}, opt));
  const txt = await r.text();
  let data=null; try{ data = txt ? JSON.parse(txt) : null; }catch(e){ data = txt; }
  if(!r.ok){
    const msg = (data && (data.msg || data.message || data.error_description || data.hint)) || ("HTTP "+r.status);
    throw Object.assign(new Error(msg), { status:r.status, code:(data&&(data.code||data.error_code))||null });
  }
  return data;
}

function mapError(e){
  const msg = String((e && e.message) || e || "");
  const status = e && e.status;
  if(!status && /fetch|network/i.test(msg)) return "無法連線，請檢查網路";
  // 具體訊息判斷放在泛用 status 判斷之前（GoTrue 部分版本用 400 回這些錯誤）
  if(/different from the old/i.test(msg) || /same_password/i.test(msg)) return "新密碼不可與舊密碼相同";
  if(/at least 6/i.test(msg) || /weak/i.test(msg)) return "新密碼至少 6 碼";
  if(/nonce/i.test(msg) || /reauthentication/i.test(msg)) return "系統安全設定需要額外驗證，請聯絡李顧問協助";
  if(status===429) return "嘗試次數過多，請等 5 分鐘後再試";
  if(status===400 || /invalid_grant/i.test(msg) || /Invalid login credentials/i.test(msg)){
    return "目前密碼不正確，請再試一次（連續多次錯誤會被系統暫時鎖定）";
  }
  if(msg) return "失敗："+msg;
  return "發生未知錯誤，請再試一次";
}

// 眼睛顯示/隱藏切換
document.querySelectorAll(".eye").forEach(function(btn){
  btn.addEventListener("click", function(){
    const inp = document.getElementById(btn.dataset.target);
    if(inp.type === "password"){ inp.type = "text"; btn.textContent = "🙈"; }
    else { inp.type = "password"; btn.textContent = "👁"; }
  });
});

function showSuccess(){
  document.getElementById("formView").style.display = "none";
  document.getElementById("succView").style.display = "";
}

const form = document.getElementById("pwForm");
const submitBtn = document.getElementById("submitBtn");
const errEl = document.getElementById("pwErr");
const origBtnText = submitBtn.textContent;

form.addEventListener("submit", async function(e){
  e.preventDefault();
  errEl.textContent = "";

  const accRaw = document.getElementById("acc").value.trim();
  const curPw = document.getElementById("curPw").value;
  const newPw = document.getElementById("newPw").value;
  const newPw2 = document.getElementById("newPw2").value;

  if(!accRaw){ errEl.textContent = "請輸入帳號"; return; }
  if(!curPw){ errEl.textContent = "請輸入目前密碼"; return; }
  if(newPw.length < 6){ errEl.textContent = "新密碼至少 6 碼"; return; }
  if(newPw === curPw){ errEl.textContent = "新密碼不可與目前密碼相同"; return; }
  if(newPw !== newPw2){ errEl.textContent = "兩次輸入的新密碼不一致"; return; }

  const email = accRaw.includes("@") ? accRaw : (accRaw + "@dinglun.app");

  submitBtn.disabled = true;
  submitBtn.textContent = "處理中…";

  let token = null;
  try{
    const d = await api("/auth/v1/token?grant_type=password", {
      method: "POST",
      body: JSON.stringify({ email: email, password: curPw })
    });
    token = d && d.access_token;
    if(!token) throw new Error("登入失敗，請再試一次");
  }catch(err){
    errEl.textContent = mapError(err);
    submitBtn.disabled = false;
    submitBtn.textContent = origBtnText;
    return;
  }

  try{
    await api("/auth/v1/user", {
      method: "PUT",
      headers: { "Authorization": "Bearer " + token },
      body: JSON.stringify({ password: newPw })
    });
  }catch(err){
    errEl.textContent = mapError(err);
    submitBtn.disabled = false;
    submitBtn.textContent = origBtnText;
    return;
  }

  // best-effort 登出，失敗靜默不影響流程
  try{
    await api("/auth/v1/logout", {
      method: "POST",
      headers: { "Authorization": "Bearer " + token }
    });
  }catch(e){ /* 靜默 */ }

  token = null;
  showSuccess();
});
</script>
</body>
</html>
